spring:
  application:
    name: charmeetchic-gateway
  cloud:
    gateway:
      # Filtros que se aplican a TODAS las rutas.
      default-filters:
        # El CORS lo resuelve SOLO el gateway (SecurityConfig). Se quita el Origin antes de reenviar para
        # que el backend no vuelva a aplicar su propio CORS: dos Access-Control-Allow-Origin en la misma
        # respuesta hacen que el navegador la rechace.
        - RemoveRequestHeader=Origin
      httpclient:
        connect-timeout: 5000      # ms para abrir la conexión con backend/rabbit-admin
        response-timeout: 30s      # tiempo máximo de respuesta
      routes:
        # /api/** -> API de inventario. Sin StripPrefix: el backend ya tiene context-path /api.
        - id: backend
          uri: ${BACKEND_URL:http://localhost:8080}
          predicates:
            - Path=/api/**
        # /admin/** -> microservicio rabbit-admin. StripPrefix=1 quita "/admin":
        # /admin/queues -> http://rabbit-admin:8081/queues
        - id: rabbit-admin
          uri: ${RABBIT_ADMIN_URL:http://localhost:8081}
          predicates:
            - Path=/admin/**
          filters:
            - StripPrefix=1

server:
  port: ${PORT:8000}
  # Detrás de Caddy: confiar en X-Forwarded-Proto/Host para saber que el cliente llegó por HTTPS.
  forward-headers-strategy: framework

logging:
  level:
    com.charmeetchic: DEBUG

app:
  security:
    firebase-project-id: ${FIREBASE_PROJECT_ID:charme-et-chic}
    jwk-set-uri: ${FIREBASE_JWK_SET_URI:https://www.googleapis.com/service_accounts/v1/jwk/securetoken@system.gserviceaccount.com}
    # Rutas que pasan SIN token (además de los preflight OPTIONS). Todo lo demás exige un ID token válido.
    public-paths: ${GATEWAY_PUBLIC_PATHS:/health,/api/health}
  cors:
    # Orígenes del frontend (separados por coma): Firebase Hosting + Angular local.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
