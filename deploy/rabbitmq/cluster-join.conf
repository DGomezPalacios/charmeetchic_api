# -----------------------------------------------------------------------------
# SOLO para rabbitmq2: al arrancar por primera vez (volumen vacío) busca a rabbit@rabbitmq1 y se une
# a su clúster. rabbitmq1 no monta este archivo: arranca solo y es el nodo al que los demás se unen.
#
# ¿Por qué no poner la lista de los dos nodos en ambos? Porque con depends_on (el 2 espera a que el 1 esté
# sano) el nodo 1 se quedaba esperando para siempre a un nodo 2 que nunca arrancaba (lo comprobamos).
#
# Requisito: la MISMA Erlang cookie en los dos nodos (RABBITMQ_ERLANG_COOKIE del .env).
# En los reinicios siguientes cada nodo recuerda su clúster (queda guardado en su volumen).
# Equivale a: rabbitmqctl stop_app && rabbitmqctl join_cluster rabbit@rabbitmq1 && rabbitmqctl start_app
# -----------------------------------------------------------------------------
cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbitmq1
