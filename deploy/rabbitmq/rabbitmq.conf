# -----------------------------------------------------------------------------
# Configuración común a los 2 nodos del clúster (se monta en /etc/rabbitmq/conf.d/).
# Cómo se forma el clúster: ver cluster-join.conf (solo lo monta rabbitmq2).
# -----------------------------------------------------------------------------

# ---- Memoria y disco (cada contenedor tiene mem_limit 512m) ----
# Sobre este uso de RAM RabbitMQ deja de aceptar publicaciones (control de flujo) en vez de caerse.
vm_memory_high_watermark.absolute = 320MiB
disk_free_limit.absolute = 1GB

# ---- Seguridad ----
# El usuario "guest" solo puede conectarse desde dentro del propio contenedor. Además, como el compose
# define RABBITMQ_DEFAULT_USER/PASS, guest ni siquiera se crea.
loopback_users.guest = true
