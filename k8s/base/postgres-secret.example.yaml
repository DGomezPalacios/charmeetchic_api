# -----------------------------------------------------------------------------
# EJEMPLO del Secret de PostgreSQL. NO contiene credenciales reales y NO está en kustomization.yaml:
# `kubectl apply -k` nunca lo aplica. Documenta qué Secret esperan los manifiestos (nombre y claves).
#
# El Secret real se crea FUERA del repositorio, con una contraseña aleatoria:
#
#   Local (kind):
#     kubectl create namespace charmeetchic
#     kubectl -n charmeetchic create secret generic postgres-credentials \
#       --from-literal=POSTGRES_USER=charmeetchic \
#       --from-literal=POSTGRES_PASSWORD="$(openssl rand -base64 24)"
#
#   CI/CD (GitHub Actions): la contraseña se guarda como secret del repositorio o del environment
#   (Settings -> Secrets and variables -> Actions, p. ej. POSTGRES_PASSWORD) y el job de despliegue la
#   pasa por variable de entorno, sin escribirla en ningún archivo ni en el log:
#     kubectl -n charmeetchic create secret generic postgres-credentials \
#       --from-literal=POSTGRES_USER=charmeetchic \
#       --from-literal=POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
#       --dry-run=client -o yaml | kubectl apply -f -
#
# Ver docs/kubernetes.md, sección "Secretos".
#
# Nota: un Secret de Kubernetes NO está cifrado, solo codificado en base64 (stringData se codifica al
# guardarlo). Por eso nunca se versiona con valores reales. En producción conviene cifrado en reposo de etcd
# y/o un gestor externo (External Secrets Operator, Sealed Secrets, Secret Manager del proveedor cloud).
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: charmeetchic
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: charmeetchic
type: Opaque
stringData:
  POSTGRES_USER: charmeetchic
  POSTGRES_PASSWORD: CAMBIAR-por-una-contrasena-aleatoria
