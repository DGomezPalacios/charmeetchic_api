# -----------------------------------------------------------------------------
# Values de Loki (chart grafana/loki, VERSIÓN FIJA en k8s/observability/versions.env) en modo MONOLÍTICO
# (SingleBinary): un solo pod con todos los componentes y almacenamiento en disco local (filesystem).
# Es el modo recomendado para volúmenes chicos; el modo distribuido (read/write/backend + object storage)
# no se justifica para una API con un par de réplicas.
#
#   helm upgrade --install loki grafana/loki --version "$LOKI_VERSION" -n monitoring \
#     -f k8s/observability/loki-values.yaml
#
# Grafana lo usa como datasource "Loki" (http://loki.monitoring.svc.cluster.local:3100).
# -----------------------------------------------------------------------------
deploymentMode: SingleBinary

fullnameOverride: loki

commonLabels:
  app.kubernetes.io/part-of: charmeetchic-observability

loki:
  # Liveness (el chart solo trae readiness): si Loki deja de responder 3 x 30 s, el kubelet lo reinicia.
  livenessProbe:
    httpGet:
      path: /ready
      port: http-metrics
    initialDelaySeconds: 60
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3
  # Un solo inquilino (sin cabecera X-Scope-OrgID): no hay varios equipos que separar.
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  # Retención corta (3 días, igual que Prometheus): el compactor borra los chunks vencidos.
  limits_config:
    retention_period: 72h
    allow_structured_metadata: true
    volume_enabled: true
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
  pattern_ingester:
    enabled: false
  ruler:
    enable_api: false

singleBinary:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 192Mi
    limits:
      cpu: 500m
      memory: 512Mi
  persistence:
    enabled: true
    size: 5Gi

# Componentes del modo distribuido: apagados.
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0
ingester:
  replicas: 0
querier:
  replicas: 0
queryFrontend:
  replicas: 0
queryScheduler:
  replicas: 0
distributor:
  replicas: 0
compactor:
  replicas: 0
indexGateway:
  replicas: 0
bloomGateway:
  replicas: 0
bloomPlanner:
  replicas: 0
bloomBuilder:
  replicas: 0

# Caches memcached (pensados para clústeres grandes; reservan GBs de memoria), gateway nginx, canario,
# tests y MinIO: no hacen falta en un nodo único.
chunksCache:
  enabled: false
resultsCache:
  enabled: false
gateway:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
minio:
  enabled: false

# Sidecar que carga reglas de alerta de Loki desde ConfigMaps: no se usan (las alertas viven en Prometheus).
sidecar:
  rules:
    enabled: false
