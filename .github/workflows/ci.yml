# Nombre del workflow, visible en la pestaña "Actions" de GitHub
name: "CI - charmeetchic-api"

# Eventos que disparan el workflow:
# - push a la rama develop (integración continua en la rama de desarrollo)
# - pull_request hacia main o develop (validación antes de fusionar cambios)
on:
  push:
    branches: [develop]
  pull_request:
    branches: [main, develop]

jobs:
  # Primer job: compila el proyecto, corre los tests y valida que el
  # artefacto generado levante correctamente (smoke test)
  build-and-test:
    # Máquina virtual donde se ejecuta el job
    runs-on: ubuntu-latest

    steps:
      # Descarga el código del repositorio en el runner
      - name: Checkout del código
        uses: actions/checkout@v4

      # Instala el JDK 17 (Temurin) y habilita el cache de dependencias Maven
      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Compila el proyecto, corre los tests unitarios/integración y empaqueta el JAR
      - name: Compilar y ejecutar tests (mvn verify)
        run: mvn -B verify

      # Smoke test: levanta el JAR generado en segundo plano y verifica que
      # el endpoint de salud responda, reintentando por si la app tarda en iniciar
      - name: Smoke test del JAR
        run: |
          java -jar target/charmeetchic-api-0.0.1-SNAPSHOT.jar &
          APP_PID=$!

          success=false
          for i in $(seq 1 30); do
            if curl --fail --silent http://localhost:8080/api/health; then
              echo "La aplicación respondió correctamente en el intento $i"
              success=true
              break
            fi
            echo "Intento $i: la aplicación aún no responde, reintentando en 2s..."
            sleep 2
          done

          kill $APP_PID || true

          if [ "$success" != "true" ]; then
            echo "El smoke test falló: /api/health no respondió tras 30 intentos"
            exit 1
          fi

      # Sube el reporte de tests (Surefire) como artefacto, incluso si el job falló
      - name: Subir reportes de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/

      # Sube el JAR generado como artefacto del workflow
      - name: Subir JAR generado
        uses: actions/upload-artifact@v4
        with:
          name: charmeetchic-api-jar
          path: target/charmeetchic-api-0.0.1-SNAPSHOT.jar

  # Segundo job: construye la imagen Docker y verifica que el contenedor arranque sano.
  # Solo corre si build-and-test terminó en verde. La imagen NO se publica en ningún registro.
  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      # Descarga el código (el Dockerfile compila desde pom.xml y src/)
      - name: Checkout del código
        uses: actions/checkout@v4

      # Buildx habilita BuildKit y el cache de capas en GitHub Actions (type=gha)
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Construye la imagen y la carga en el Docker del runner (load: true) sin publicarla (push: false).
      # Las labels OCI permiten rastrear desde qué commit y repositorio se generó la imagen.
      - name: Construir imagen Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: |
            charmeetchic-api:${{ github.sha }}
            charmeetchic-api:ci
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=0.0.1-SNAPSHOT
          # Reutiliza las capas entre ejecuciones (dependencias Maven, JRE base, etc.)
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Levanta el contenedor, espera a que el HEALTHCHECK del Dockerfile lo marque "healthy"
      # (máximo 120 s) y valida /api/health con curl. Si algo falla, muestra los logs y falla el job.
      - name: Verificar contenedor (healthcheck + /api/health)
        run: |
          docker run -d --name cc-api -p 8080:8080 charmeetchic-api:ci

          status=""
          for i in $(seq 1 24); do
            status=$(docker inspect --format '{{.State.Health.Status}}' cc-api)
            echo "Intento $i: estado del contenedor = $status"
            if [ "$status" = "healthy" ] || [ "$status" = "unhealthy" ]; then
              break
            fi
            sleep 5
          done

          if [ "$status" != "healthy" ] || ! curl --fail --silent --show-error http://localhost:8080/api/health; then
            echo "El contenedor no quedó healthy o /api/health no respondió. Logs del contenedor:"
            docker logs cc-api
            docker rm -f cc-api
            exit 1
          fi

          echo
          echo "Contenedor healthy y /api/health respondió correctamente"
          docker inspect --format '{{json .Config.Labels}}' cc-api
          docker rm -f cc-api
