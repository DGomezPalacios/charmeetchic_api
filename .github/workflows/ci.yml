# Nombre del workflow, visible en la pestaña "Actions" de GitHub
name: "CI - charmeetchic-api"

# Eventos que disparan el workflow:
# - pull_request hacia main o develop: validación antes de fusionar (tests, imagen, Trivy, manifiestos).
# - push a develop: integración continua + publicación de la imagen + despliegue en "staging".
# - push a main (merge de una release o un hotfix): lo mismo, desplegando en "production".
# - push de un tag vX.Y.Z (release): publica la imagen con los tags de versión X.Y.Z y X.Y (no despliega:
#   el commit etiquetado ya se desplegó al llegar a main).
# Qué job corre en cada evento: tabla en docs/workflow.md.
on:
  push:
    branches: [develop, main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main, develop]

# Mínimo privilegio: por defecto el GITHUB_TOKEN de todos los jobs solo puede leer el código.
# Un job que necesite algo más lo pide en su propio bloque `permissions` (que reemplaza a este).
permissions:
  contents: read

# Una sola ejecución en curso por PR (o por rama/tag en los push). En un PR, un commit nuevo cancela la
# ejecución anterior, que ya valida un estado obsoleto. En un push NO se cancela: cortar a la mitad la
# publicación de una imagen o un despliegue dejaría el entorno en un estado intermedio; la ejecución nueva
# espera a que termine la anterior.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Job gitflow-guard: hace cumplir GitFlow en los PRs hacia main. Solo pueden llegar a main una release (rama
  # develop) o una corrección urgente (hotfix/*). Cualquier otra rama (feature/*, docs/*, fix/*...) debe ir a develop.
  # Motivo: los PRs #16 (fix/skip-tests-docker) y #27 (feature/k8s) se fusionaron por error en main, que es la rama
  # por defecto del repositorio y la que GitHub propone como base al abrir un PR (ver CONTRIBUTING.md).
  # Es check requerido solo en main; en los PRs hacia develop el job no corre.
  gitflow-guard:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    # Solo compara el nombre de una rama: no necesita checkout ni ningún permiso del GITHUB_TOKEN.
    permissions: {}
    timeout-minutes: 2

    steps:
      # github.head_ref es el nombre de la rama de origen del PR, que elige quien abre el PR. Se pasa por variable
      # de entorno y no interpolado en el script, para que un nombre de rama con caracteres de shell no se ejecute.
      - name: Verificar la rama de origen del PR (develop o hotfix/*)
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          case "$HEAD_REF" in
            develop|hotfix/*)
              echo "GitFlow OK: '${HEAD_REF}' puede mergearse en main."
              ;;
            *)
              echo "::error title=GitFlow: base incorrecta::La rama '${HEAD_REF}' no puede mergearse en main. A main solo llegan develop (release) y hotfix/* (corrección urgente). Cambia la base del PR a develop: botón 'Edit' junto al título del PR -> base: develop."
              {
                echo "## ❌ GitFlow: este PR no puede ir a main"
                echo
                echo "La rama de origen es \`${HEAD_REF}\`. A \`main\` (producción) solo llegan:"
                echo
                echo "- \`develop\`: una release (PR \`develop → main\`)."
                echo "- \`hotfix/*\`: una corrección urgente sobre producción."
                echo
                echo "**Cómo corregirlo:** cambia la base del PR a \`develop\` (botón *Edit* junto al título del PR"
                echo "→ *base: develop*), o desde la terminal:"
                echo
                echo '```bash'
                echo "gh pr edit <número-del-PR> --base develop"
                echo '```'
                echo
                echo "No hace falta cerrar el PR ni rehacer los commits. Si es una corrección urgente de producción,"
                echo "la rama debe llamarse \`hotfix/<descripción>\` y salir de \`main\`. Ver CONTRIBUTING.md, *Flujo de merge*."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
              ;;
          esac

  # Primer job: compila el proyecto, corre los tests y valida que el
  # artefacto generado levante correctamente (smoke test)
  build-and-test:
    # Máquina virtual donde se ejecuta el job
    runs-on: ubuntu-latest
    # Una ejecución normal tarda unos pocos minutos; el límite corta un job colgado
    # (por ejemplo, un test bloqueado) antes de los 360 minutos por defecto de GitHub.
    timeout-minutes: 20

    steps:
      # Descarga el código del repositorio en el runner
      - name: Checkout del código
        uses: actions/checkout@v4

      # Instala el JDK 17 (Temurin) y habilita el cache de dependencias Maven
      - name: Configurar JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Compila y ejecuta solo las pruebas unitarias (surefire). Falla rápido si hay una regresión de lógica.
      # El agente de JaCoCo registra la cobertura en target/jacoco.exec.
      - name: Pruebas unitarias (mvn test)
        run: mvn -B test

      # Pruebas de integración (failsafe), empaquetado del JAR, reporte de cobertura y política de umbrales.
      # -DskipUTs=true evita repetir las unitarias; lo compilado se reutiliza ("Nothing to compile") y
      # JaCoCo agrega (append) la cobertura de integración al mismo jacoco.exec, así el reporte es combinado.
      # Si la cobertura baja de los umbrales del pom.xml, este step falla.
      - name: Pruebas de integración y verificación de cobertura (mvn verify)
        run: mvn -B verify -DskipUTs=true

      # Smoke test: levanta el JAR generado en segundo plano y verifica que
      # el endpoint de salud responda, reintentando por si la app tarda en iniciar
      - name: Smoke test del JAR
        run: |
          java -jar target/charmeetchic-api-0.0.1-SNAPSHOT.jar &
          APP_PID=$!

          success=false
          for i in $(seq 1 30); do
            if curl --fail --silent http://localhost:8080/api/health; then
              echo "La aplicación respondió correctamente en el intento $i"
              success=true
              break
            fi
            echo "Intento $i: la aplicación aún no responde, reintentando en 2s..."
            sleep 2
          done

          kill $APP_PID || true

          if [ "$success" != "true" ]; then
            echo "El smoke test falló: /api/health no respondió tras 30 intentos"
            exit 1
          fi

      # Resumen en la página del job (Job Summary): tests por tipo y cobertura de líneas/ramas.
      # Solo bash + awk (vienen en el runner): sin actions de terceros ni dependencias externas.
      # Corre siempre, para que el resumen también explique un job en rojo.
      - name: Publicar resumen de tests y cobertura
        if: always()
        run: |
          # Suma los atributos tests/failures/errors/skipped de los TEST-*.xml de un directorio
          contar() {
            if ! ls "$1"/TEST-*.xml >/dev/null 2>&1; then
              echo "| $2 | - | - | - | - |"
              return
            fi
            awk -v tipo="$2" '
              /<testsuite / {
                for (i = 1; i <= NF; i++) {
                  if ($i ~ /^tests=/)    { gsub(/[^0-9]/, "", $i); t += $i }
                  if ($i ~ /^failures=/) { gsub(/[^0-9]/, "", $i); f += $i }
                  if ($i ~ /^errors=/)   { gsub(/[^0-9]/, "", $i); e += $i }
                  if ($i ~ /^skipped=/)  { gsub(/[^0-9]/, "", $i); s += $i }
                }
              }
              END { printf "| %s | %d | %d | %d | %d |\n", tipo, t, f, e, s }
            ' "$1"/TEST-*.xml
          }

          {
            echo "## Resultados de pruebas"
            echo
            echo "| Tipo | Tests | Fallos | Errores | Omitidos |"
            echo "|---|---:|---:|---:|---:|"
            contar target/surefire-reports "Unitarias (surefire)"
            contar target/failsafe-reports "Integración (failsafe)"
            echo
            echo "## Cobertura (JaCoCo, unitarias + integración)"
            echo
            CSV=target/site/jacoco/jacoco.csv
            if [ -f "$CSV" ]; then
              # Columnas del CSV: 6-7 ramas perdidas/cubiertas, 8-9 líneas perdidas/cubiertas
              awk -F, 'NR > 1 { lm += $8; lc += $9; bm += $6; bc += $7 }
                END {
                  print "| Métrica | Cubiertas | Total | Cobertura |"
                  print "|---|---:|---:|---:|"
                  printf "| Líneas | %d | %d | %.1f%% |\n", lc, lc + lm, 100 * lc / (lc + lm)
                  printf "| Ramas | %d | %d | %.1f%% |\n", bc, bc + bm, 100 * bc / (bc + bm)
                }' "$CSV"
              echo
              echo "Umbrales: ver la sección *Política de calidad* de CONTRIBUTING.md. Reporte HTML en el artefacto \`reporte-cobertura\`."
            else
              echo "No se generó el reporte de cobertura (el job falló antes de la fase verify)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Sube los reportes de tests (surefire = unitarias, failsafe = integración), incluso si el job falló
      - name: Subir reportes de tests
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reportes-tests
          path: |
            target/surefire-reports/
            target/failsafe-reports/

      # Sube el reporte HTML de cobertura de JaCoCo (abrir index.html), incluso si falló el umbral
      - name: Subir reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reporte-cobertura
          path: target/site/jacoco/
          if-no-files-found: ignore

      # Sube el JAR generado como artefacto del workflow
      - name: Subir JAR generado
        uses: actions/upload-artifact@v7
        with:
          name: charmeetchic-api-jar
          path: target/charmeetchic-api-0.0.1-SNAPSHOT.jar

  # Análisis estático de código y cobertura en SonarCloud (bugs, vulnerabilidades, code smells,
  # duplicación). Corre en paralelo con docker-build, después de que build-and-test esté en verde.
  # El job falla si el quality gate de SonarCloud falla (-Dsonar.qualitygate.wait=true).
  sonarcloud:
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 20
    # Los PRs desde forks no reciben secrets: el análisis no podría autenticarse. Los PRs de Dependabot
    # sí lo tienen, porque SONAR_TOKEN también está cargado como secret de Dependabot.
    # En el push de un tag vX.Y.Z no corre: el commit etiquetado ya se analizó al llegar a main, y SonarCloud
    # trataría el tag como una rama nueva.
    if: >-
      (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/'))
      || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      # Historial completo: SonarCloud usa git blame para atribuir cada problema a su commit y
      # distinguir el "código nuevo" del existente.
      - name: Checkout del código (historial completo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Cache de los plugins de análisis que descarga el scanner (~/.sonar/cache)
      - name: Cache de SonarCloud
        uses: actions/cache@v6
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # verify genera el XML de JaCoCo (unitarias + integración) que lee SonarCloud; el plugin toma la
      # versión fijada en el pluginManagement del pom.xml y la organización/proyecto de sus propiedades.
      # El token llega solo como variable de entorno: nunca aparece en el comando ni en el log.
      - name: Análisis de SonarCloud (mvn verify + sonar)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.qualitygate.wait=true

  # Job docker-build: construye la imagen Docker, la escanea con Trivy y verifica que el contenedor arranque sano.
  # Solo corre si build-and-test terminó en verde. Esta imagen NO se publica: la publica publish-image (solo en
  # push), una vez que este job, el escaneo de Trivy incluido, terminó en verde.
  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 20
    # Único job que escribe algo con el GITHUB_TOKEN: subir el SARIF de Trivy a Code Scanning
    # (pestaña Security). Al declarar permissions aquí se reemplaza el bloque global, por eso se
    # repite contents: read (lo necesita el checkout).
    permissions:
      contents: read
      security-events: write

    steps:
      # Descarga el código (el Dockerfile compila desde pom.xml y src/)
      - name: Checkout del código
        uses: actions/checkout@v4

      # Actions de terceros fijadas por el SHA completo del commit, no por tag: un tag se puede mover a otro
      # commit (si el repositorio de la action se ve comprometido), un SHA no. El comentario indica la versión
      # y Dependabot (ecosistema github-actions) actualiza ambos.

      # Buildx habilita BuildKit y el cache de capas en GitHub Actions (type=gha)
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Labels OCI generadas por metadata-action a partir del evento de Git, no escritas a mano: revision
      # (commit), source (repositorio), created (fecha del build) y version. version sale del tag con mayor
      # prioridad: X.Y.Z en un tag de Git vX.Y.Z, el nombre de la rama en un push y pr-<número> en un PR.
      # Así no queda un "0.0.1-SNAPSHOT" fijo que se desactualiza al cambiar el pom.xml (review del PR #10).
      # Las mismas reglas de tags que publish-image, para que ambas imágenes tengan las mismas labels; los
      # tags raw (<sha completo> y ci) son los nombres locales que usan Trivy y la verificación del contenedor.
      - name: Metadatos de la imagen (tags y labels OCI)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: charmeetchic-api
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-,format=short
            type=raw,value=${{ github.sha }}
            type=raw,value=ci

      # Construye la imagen y la carga en el Docker del runner (load: true) sin publicarla (push: false).
      # Las labels OCI permiten rastrear desde qué commit y repositorio se generó la imagen.
      - name: Construir imagen Docker
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Reutiliza las capas entre ejecuciones (dependencias Maven, JRE base, etc.)
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---------------- Escaneo de vulnerabilidades de la imagen con Trivy ----------------
      # Trivy revisa los paquetes del sistema (Alpine), el JRE y los JAR de BOOT-INF/lib (Spring, Tomcat,
      # Jackson...). Criterio:
      #   - Se reportan CRITICAL y HIGH, con ignore-unfixed: true. Una vulnerabilidad sin versión corregida no
      #     es accionable (no hay a qué actualizar); se ve en el aviso público, pero no ensucia el reporte.
      #   - Solo bloquea (exit-code 1) una CRITICAL con corrección disponible: es grave y tiene solución
      #     concreta (subir la versión), así que no hay motivo para dejarla pasar a develop o main.
      #   - Las HIGH se reportan sin bloquear: quedan en el log, en el SARIF y en la pestaña Security para
      #     atenderlas vía Dependabot o en una rama propia, sin frenar todo el flujo de trabajo por cada aviso.
      # La versión de Trivy se fija explícitamente para que el resultado no cambie por una versión nueva.
      # Riesgos aceptados: .trivyignore (los tres pasos lo usan). Cada excepción lleva su justificación y una
      # fecha de vencimiento (exp:); al vencer, la vulnerabilidad vuelve a aparecer y a bloquear.

      # 1) Reporte SARIF (CRITICAL + HIGH) para GitHub Code Scanning. Nunca falla: solo genera el archivo.
      - name: Trivy - reporte SARIF (CRITICAL y HIGH)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: 'v0.76.2'
          image-ref: charmeetchic-api:${{ github.sha }}
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
          format: sarif
          output: trivy-results.sarif
          exit-code: '0'

      # 2) Tabla legible en el log del job (CRITICAL + HIGH). Tampoco falla.
      - name: Trivy - reporte en el log (CRITICAL y HIGH)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: 'v0.76.2'
          image-ref: charmeetchic-api:${{ github.sha }}
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
          format: table
          exit-code: '0'
          skip-setup-trivy: true

      # (El paso 3, el gate que bloquea, va al final del job: así la verificación del contenedor corre
      # igual y el log muestra ambos resultados aunque Trivy encuentre una CRITICAL.)

      # Levanta el contenedor, espera a que el HEALTHCHECK del Dockerfile lo marque "healthy"
      # (máximo 120 s) y valida /api/health con curl. Si algo falla, muestra los logs y falla el job.
      - name: Verificar contenedor (healthcheck + /api/health)
        run: |
          docker run -d --name cc-api -p 8080:8080 charmeetchic-api:ci

          status=""
          for i in $(seq 1 24); do
            status=$(docker inspect --format '{{.State.Health.Status}}' cc-api)
            echo "Intento $i: estado del contenedor = $status"
            if [ "$status" = "healthy" ] || [ "$status" = "unhealthy" ]; then
              break
            fi
            sleep 5
          done

          if [ "$status" != "healthy" ] || ! curl --fail --silent --show-error http://localhost:8080/api/health; then
            echo "El contenedor no quedó healthy o /api/health no respondió. Logs del contenedor:"
            docker logs cc-api
            docker rm -f cc-api
            exit 1
          fi

          echo
          echo "Contenedor healthy y /api/health respondió correctamente"
          docker inspect --format '{{json .Config.Labels}}' cc-api
          docker rm -f cc-api

      # 3) Gate de Trivy: falla el job si hay alguna CRITICAL con corrección disponible (criterio arriba).
      - name: Trivy - bloquear CRITICAL corregibles
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: 'v0.76.2'
          image-ref: charmeetchic-api:${{ github.sha }}
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          format: table
          exit-code: '1'
          skip-setup-trivy: true

      # Publica el SARIF en la pestaña Security (Code scanning) aunque el gate o la verificación hayan
      # fallado, para ver ahí el detalle de cada vulnerabilidad. hashFiles evita un error adicional si el
      # escaneo ni siquiera llegó a correr (por ejemplo, si falló el build de la imagen).
      - name: Subir resultados de Trivy a GitHub Code Scanning
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-imagen

  # Job k8s-validate: renderiza los manifiestos de Kubernetes (k8s/) con Kustomize y los valida contra los
  # esquemas oficiales de la API de Kubernetes con kubeconform. Detecta antes del merge un campo mal escrito,
  # un tipo incorrecto o un recurso que no existe en la versión de Kubernetes objetivo, sin necesitar un clúster.
  # Corre en paralelo con docker-build y sonarcloud, después de build-and-test.
  k8s-validate:
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 10
    env:
      # Versiones fijas: el resultado no cambia porque salga una versión nueva de las herramientas.
      KUSTOMIZE_VERSION: v5.8.3
      KUSTOMIZE_SHA256: cb9e31198d3f63b44848bd0afc4c8efc56e6cfef9c93a4a39a211940e6decd61
      KUBECONFORM_VERSION: v0.8.0
      KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
      # Versión de Kubernetes cuyos esquemas se usan: la misma del clúster kind (k8s/kind-config.yaml).
      K8S_VERSION: 1.35.8

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      # Binarios oficiales de las releases de GitHub, sin actions de terceros. Cada descarga se verifica
      # contra su SHA-256 publicado (checksums.txt / CHECKSUMS de la release): si el archivo fue alterado,
      # sha256sum -c falla y el job se detiene antes de ejecutarlo.
      # --proto '=https' --tlsv1.2: curl solo acepta HTTPS con TLS 1.2 o superior, también en las redirecciones que
      # sigue con -L (las releases de GitHub redirigen a otro dominio): una redirección a http:// hace fallar la descarga.
      - name: Instalar kustomize y kubeconform (versión fija + checksum)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --proto '=https' --tlsv1.2 -sSfL -o kustomize.tar.gz \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          echo "${KUSTOMIZE_SHA256}  kustomize.tar.gz" | sha256sum -c -
          curl --proto '=https' --tlsv1.2 -sSfL -o kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tar.gz" | sha256sum -c -
          mkdir -p bin
          tar -xzf kustomize.tar.gz -C bin kustomize
          tar -xzf kubeconform.tar.gz -C bin kubeconform
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # kustomize build de cada overlay: falla si un patch no aplica, falta un archivo o la base es inválida.
      - name: Renderizar overlays (kustomize build)
        run: |
          set -euo pipefail
          kustomize version
          mkdir -p rendered
          kustomize build k8s/overlays/dev  > rendered/dev.yaml
          kustomize build k8s/overlays/prod > rendered/prod.yaml
          echo "dev:  $(grep -c '^kind:' rendered/dev.yaml) recursos"
          echo "prod: $(grep -c '^kind:' rendered/prod.yaml) recursos"

      # kubeconform valida cada recurso contra el esquema JSON de su kind/apiVersion en Kubernetes $K8S_VERSION.
      #  -strict: rechaza campos que no existen en el esquema (p. ej. "readinesProbe" mal escrito), que
      #           kubectl ignoraría en silencio.
      #  -summary: imprime el total de recursos válidos, inválidos y con error.
      # También se validan el Secret de ejemplo y el pod del smoke test del job deploy, que no forman parte
      # de ningún overlay.
      - name: Validar manifiestos (kubeconform -strict)
        run: |
          kubeconform -v
          kubeconform -strict -summary -output text \
            -kubernetes-version "$K8S_VERSION" \
            -schema-location default \
            rendered/dev.yaml rendered/prod.yaml k8s/base/postgres-secret.example.yaml k8s/ci/smoke-test-pod.yaml

  # Job publish-image: publica la imagen en GitHub Container Registry (ghcr.io) con trazabilidad completa.
  # Solo en push (develop, main o un tag vX.Y.Z), NUNCA en pull_request: un PR no debe publicar artefactos, y un
  # PR desde un fork no tiene permiso de escritura en el registro. Por eso no es un check requerido de los PRs.
  # Corre después de build-and-test y docker-build: solo se publica una imagen que pasó los tests, el escaneo de
  # Trivy y la verificación del contenedor.
  publish-image:
    runs-on: ubuntu-latest
    needs: [build-and-test, docker-build]
    if: github.event_name == 'push'
    timeout-minutes: 20
    # Mínimo privilegio para este job:
    #  - contents: read      -> checkout.
    #  - packages: write     -> publicar la imagen en ghcr.io con el GITHUB_TOKEN (sin tokens personales).
    #  - id-token: write     -> token OIDC con el que se firma la atestación de procedencia (Sigstore).
    #  - attestations: write -> guardar la atestación en el repositorio.
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    # Lo que necesita el job deploy para desplegar exactamente esta imagen.
    outputs:
      image: ${{ steps.vars.outputs.image }}
      sha-tag: ${{ steps.vars.outputs.sha_tag }}
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      # GHCR exige el nombre en minúsculas (el dueño del repositorio tiene mayúsculas). sha-<7 caracteres>
      # coincide con el tag que genera metadata-action (type=sha, format=short).
      - name: Nombre de la imagen y tag inmutable
        id: vars
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charmeetchic-api" >> "$GITHUB_OUTPUT"
          echo "sha_tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Login con el GITHUB_TOKEN del workflow (expira al terminar el job); no se guarda ninguna credencial.
      - name: Login en GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags de la imagen publicada:
      #  - sha-<commit corto>: INMUTABLE, identifica exactamente el commit; es el que usa el despliegue.
      #  - develop / main: el nombre de la rama; se mueve con cada push (lo último de cada entorno).
      #  - X.Y.Z y X.Y: solo en un tag de Git vX.Y.Z (release). X.Y apunta a la última corrección de esa versión.
      # Labels y anotaciones OCI (revision, source, version, created...) generadas por metadata-action.
      # DOCKER_METADATA_ANNOTATIONS_LEVELS: las anotaciones van al manifiesto y al índice (con SBOM y
      # provenance la imagen se publica como índice OCI).
      - name: Metadatos de la imagen (tags, labels y anotaciones OCI)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ steps.vars.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,prefix=sha-,format=short

      # Construye y publica. El cache de GitHub Actions (type=gha) es el mismo que llenó docker-build, así que
      # las capas se reutilizan y la imagen publicada corresponde a la que se escaneó y verificó.
      #  - provenance mode=max: atestación SLSA de BuildKit (cómo, cuándo y desde qué commit se construyó).
      #  - sbom: true: SBOM (lista de paquetes y JAR de la imagen) adjunto a la imagen en el registro.
      - name: Construir y publicar la imagen
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      # Atestación de procedencia de GitHub (firmada con Sigstore) asociada al digest: permite verificar con
      # `gh attestation verify oci://<imagen>@<digest> --repo <owner>/<repo>` que la imagen salió de este
      # repositorio y de este workflow. push-to-registry: también la guarda junto a la imagen en ghcr.io.
      - name: Atestación de procedencia (GitHub)
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ steps.vars.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Publicar resumen de la imagen
        env:
          IMAGE: ${{ steps.vars.outputs.image }}
          SHA_TAG: ${{ steps.vars.outputs.sha_tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          {
            echo "## Imagen publicada en GHCR"
            echo
            echo "| Campo | Valor |"
            echo "|---|---|"
            echo "| Imagen | \`${IMAGE}\` |"
            echo "| Tag inmutable | \`${SHA_TAG}\` |"
            echo "| Digest | \`${DIGEST}\` |"
            echo "| Commit | [\`${GITHUB_SHA}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}) |"
            echo "| Ref | \`${GITHUB_REF}\` |"
            echo "| org.opencontainers.image.version | \`${VERSION}\` |"
            echo
            echo "**Tags:**"
            echo
            while read -r tag; do echo "- \`${tag}\`"; done <<< "$TAGS"
            echo
            echo "Descargar por digest (inmutable): \`docker pull ${IMAGE}@${DIGEST}\`"
            echo
            echo "Verificar la procedencia: \`gh attestation verify oci://${IMAGE}@${DIGEST} --repo ${GITHUB_REPOSITORY}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # Job deploy: despliegue automático en un entorno cloud SIMULADO (un clúster kind creado en el runner).
  # Solo en push a develop (entorno "staging", overlay dev) o a main (entorno "production", overlay prod); no en
  # PRs ni en tags. Usa GitHub Environments: cada ejecución queda registrada como un deployment del repositorio
  # (pestaña Deployments) y el entorno puede exigir aprobación manual (Settings -> Environments).
  # Despliega exactamente la imagen que publicó publish-image (tag sha-<commit>, verificada por digest) y solo
  # después de que k8s-validate validó los manifiestos.
  deploy:
    runs-on: ubuntu-latest
    needs: [publish-image, k8s-validate]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    timeout-minutes: 30
    # packages: read -> descargar la imagen de ghcr.io (aunque el paquete sea privado).
    permissions:
      contents: read
      packages: read
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
      # No hay una URL pública (el clúster vive y muere con el runner): el enlace del deployment lleva a esta
      # ejecución, cuyo Job Summary muestra qué se desplegó y el resultado del smoke test.
      url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    env:
      ENVIRONMENT: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
      OVERLAY: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}
      NAMESPACE: charmeetchic
      IMAGE: ${{ needs.publish-image.outputs.image }}
      SHA_TAG: ${{ needs.publish-image.outputs.sha-tag }}
      DIGEST: ${{ needs.publish-image.outputs.digest }}
      # Herramientas en versiones fijas, verificadas por SHA-256 (mismo criterio que k8s-validate): kind v0.33.0
      # (la imagen de nodo, Kubernetes 1.35.8, está en k8s/kind-config.yaml) y kubectl de la misma versión.
      KIND_VERSION: v0.33.0
      KIND_SHA256: aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d
      KUBECTL_VERSION: v1.35.8
      KUBECTL_SHA256: 874d5e72dbb819f43cff16bcd1e4f8bac5b7f2361fe1e55049b0a6c676fb0cbf
      KUSTOMIZE_VERSION: v5.8.3
      KUSTOMIZE_SHA256: cb9e31198d3f63b44848bd0afc4c8efc56e6cfef9c93a4a39a211940e6decd61

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      # Solo HTTPS con TLS 1.2+, incluso tras redirecciones (--proto '=https' --tlsv1.2), y SHA-256 de cada archivo.
      - name: Instalar kind, kubectl y kustomize (versión fija + checksum)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          mkdir -p bin
          curl --proto '=https' --tlsv1.2 -sSfL -o bin/kind "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          echo "${KIND_SHA256}  bin/kind" | sha256sum -c -
          curl --proto '=https' --tlsv1.2 -sSfL -o bin/kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          echo "${KUBECTL_SHA256}  bin/kubectl" | sha256sum -c -
          curl --proto '=https' --tlsv1.2 -sSfL -o kustomize.tar.gz \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          echo "${KUSTOMIZE_SHA256}  kustomize.tar.gz" | sha256sum -c -
          tar -xzf kustomize.tar.gz -C bin kustomize
          chmod +x bin/kind bin/kubectl
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # Clúster de 3 nodos (1 control-plane + 2 workers) con la misma configuración que en local. Cada nodo de
      # kind ve toda la CPU y la memoria del runner (4 vCPU y 16 GB en repositorios públicos), así que los
      # requests del overlay prod (3 réplicas x 500m/1Gi + PostgreSQL 500m/1Gi) caben sin ajustar los manifiestos.
      - name: Crear el clúster kind
        run: |
          kind create cluster --config k8s/kind-config.yaml --wait 180s
          kubectl get nodes -o wide

      # Descarga la imagen publicada por su tag inmutable y comprueba que su digest sea el que publicó
      # publish-image. Luego la carga en los nodos con kind load: los nodos no la descargan de ghcr.io, así que
      # el despliegue no depende de la visibilidad (pública o privada) del paquete.
      - name: Login en GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Descargar la imagen y cargarla en kind
        run: |
          set -euo pipefail
          docker pull "${IMAGE}:${SHA_TAG}"
          if ! docker image inspect --format '{{join .RepoDigests "\n"}}' "${IMAGE}:${SHA_TAG}" | grep -qF "@${DIGEST}"; then
            echo "::error::El digest de ${IMAGE}:${SHA_TAG} no coincide con el publicado (${DIGEST})"
            exit 1
          fi
          echo "Digest verificado: ${DIGEST}"
          kind load docker-image "${IMAGE}:${SHA_TAG}" --name charmeetchic

      # Versión de la aplicación (la del pom.xml): la que expone GET /api/health y la de la label
      # app.kubernetes.io/version. El smoke test comprueba que coincidan.
      - name: Leer la versión de la aplicación
        run: |
          APP_VERSION=$(python3 -c "import xml.etree.ElementTree as ET; ns={'m': 'http://maven.apache.org/POM/4.0.0'}; print(ET.parse('pom.xml').getroot().find('m:version', ns).text)")
          echo "APP_VERSION=${APP_VERSION}" >> "$GITHUB_ENV"
          echo "Versión de la aplicación: ${APP_VERSION}"

      # Secrets generados en el runner: contraseñas aleatorias que solo existen en este clúster efímero.
      # ::add-mask:: las oculta si llegaran a aparecer en el log; no se imprimen ni se escriben en disco.
      - name: Crear el namespace y los Secrets
        run: |
          set -euo pipefail
          kubectl apply -f k8s/base/namespace.yaml
          PG_PASSWORD="$(openssl rand -base64 24)"
          echo "::add-mask::${PG_PASSWORD}"
          kubectl -n "$NAMESPACE" create secret generic postgres-credentials \
            --from-literal=POSTGRES_USER=charmeetchic \
            --from-literal=POSTGRES_PASSWORD="${PG_PASSWORD}"
          # El overlay dev (staging) valida los JWT en modo local: necesita su secreto HS256.
          if [ "$OVERLAY" = "dev" ]; then
            JWT_SECRET="$(openssl rand -hex 32)"
            echo "::add-mask::${JWT_SECRET}"
            kubectl -n "$NAMESPACE" create secret generic charmeetchic-api-jwt-local \
              --from-literal=JWT_LOCAL_SECRET="${JWT_SECRET}"
          fi

      # Fija en el overlay (solo en el runner, no se commitea) qué se despliega:
      #  - la imagen por su tag inmutable sha-<commit>;
      #  - un patch del Deployment con kubernetes.io/change-cause (columna CHANGE-CAUSE de rollout history),
      #    las anotaciones del pod (commit completo, digest, ejecución del workflow) y la label de versión.
      #    Es un patch solo del Deployment de la API: el StatefulSet de PostgreSQL no cambia y no se reinicia.
      - name: Fijar imagen y trazabilidad con kustomize
        working-directory: k8s/overlays/${{ env.OVERLAY }}
        run: |
          set -euo pipefail
          kustomize edit set image "charmeetchic-api=${IMAGE}:${SHA_TAG}"
          {
            echo "apiVersion: apps/v1"
            echo "kind: Deployment"
            echo "metadata:"
            echo "  name: charmeetchic-api"
            echo "  labels:"
            echo "    app.kubernetes.io/version: \"${APP_VERSION}\""
            echo "  annotations:"
            echo "    kubernetes.io/change-cause: \"Despliegue ${ENVIRONMENT} del commit ${GITHUB_SHA} (run ${GITHUB_RUN_NUMBER})\""
            echo "spec:"
            echo "  template:"
            echo "    metadata:"
            echo "      labels:"
            echo "        app.kubernetes.io/version: \"${APP_VERSION}\""
            echo "      annotations:"
            echo "        charmeetchic.cl/git-commit: \"${GITHUB_SHA}\""
            echo "        charmeetchic.cl/image-digest: \"${DIGEST}\""
            echo "        charmeetchic.cl/workflow-run: \"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\""
          } > deploy-trace-patch.yaml
          kustomize edit add patch --path deploy-trace-patch.yaml
          echo "--- kustomization.yaml (${OVERLAY}) con la imagen y el patch del despliegue:"
          cat kustomization.yaml
          kustomize build . > "$RUNNER_TEMP/rendered.yaml"
          echo "--- Imágenes y trazabilidad en el YAML final:"
          grep -nE 'image: |change-cause|git-commit|image-digest|app.kubernetes.io/version' "$RUNNER_TEMP/rendered.yaml"

      - name: Aplicar manifiestos (kubectl apply -k)
        run: kubectl apply -k "k8s/overlays/${OVERLAY}"

      # Timeouts: PostgreSQL inicializa la base (initdb) en el primer arranque; la API espera a PostgreSQL
      # (initContainer) y Spring Boot tarda en arrancar, con varias réplicas compartiendo la CPU del runner.
      - name: Esperar el rollout de PostgreSQL y de la API
        run: |
          kubectl -n "$NAMESPACE" rollout status statefulset/postgres --timeout=300s
          kubectl -n "$NAMESPACE" rollout status deployment/charmeetchic-api --timeout=600s
          kubectl -n "$NAMESPACE" get pods -o wide

      # Pod con curl DENTRO del clúster contra el Service (ver k8s/ci/smoke-test-pod.yaml).
      - name: Smoke test desde dentro del clúster
        run: |
          set -uo pipefail
          sed "s/__EXPECTED_VERSION__/${APP_VERSION}/" k8s/ci/smoke-test-pod.yaml | kubectl apply -f -
          phase=""
          for _ in $(seq 1 60); do
            phase=$(kubectl -n "$NAMESPACE" get pod smoke-test -o jsonpath='{.status.phase}')
            if [ "$phase" = "Succeeded" ] || [ "$phase" = "Failed" ]; then break; fi
            sleep 3
          done
          kubectl -n "$NAMESPACE" logs smoke-test | tee "$RUNNER_TEMP/smoke-test.log"
          echo "Estado del pod smoke-test: ${phase:-desconocido}"
          [ "$phase" = "Succeeded" ]

      # Diagnóstico si cualquier paso anterior falló: estado de los pods, describe, eventos y logs de la API.
      - name: Diagnóstico del despliegue (solo si falló)
        if: failure()
        run: |
          kubectl -n "$NAMESPACE" get pods -o wide || true
          kubectl -n "$NAMESPACE" describe pods || true
          kubectl -n "$NAMESPACE" get events --sort-by=.lastTimestamp || true
          kubectl -n "$NAMESPACE" logs -l app.kubernetes.io/name=charmeetchic-api -c wait-for-postgres --tail=50 --prefix || true
          kubectl -n "$NAMESPACE" logs -l app.kubernetes.io/name=charmeetchic-api -c api --tail=200 --prefix || true
          kubectl -n "$NAMESPACE" logs -l app.kubernetes.io/name=charmeetchic-api -c api --previous --tail=100 --prefix || true

      - name: Publicar resumen del despliegue
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## Despliegue en ${ENVIRONMENT} (${JOB_STATUS})"
            echo
            echo "| Campo | Valor |"
            echo "|---|---|"
            echo "| Entorno | \`${ENVIRONMENT}\` (overlay \`k8s/overlays/${OVERLAY}\`, clúster kind efímero en el runner) |"
            echo "| Commit | [\`${GITHUB_SHA}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}) |"
            echo "| Imagen | \`${IMAGE}:${SHA_TAG}\` |"
            echo "| Digest | \`${DIGEST}\` |"
            echo "| Versión de la aplicación | \`${APP_VERSION:-?}\` |"
            echo
            echo "### Pods"
            echo
            echo '```'
            kubectl -n "$NAMESPACE" get pods -o wide 2>&1 || true
            echo '```'
            echo
            echo "### Trazabilidad de los pods de la API"
            echo
            echo '```'
            kubectl -n "$NAMESPACE" get pods -l app.kubernetes.io/name=charmeetchic-api \
              -o custom-columns='POD:.metadata.name,NODO:.spec.nodeName,VERSION:.metadata.labels.app\.kubernetes\.io/version,COMMIT:.metadata.annotations.charmeetchic\.cl/git-commit' 2>&1 || true
            echo '```'
            echo
            echo "### kubectl rollout history"
            echo
            echo '```'
            kubectl -n "$NAMESPACE" rollout history deployment/charmeetchic-api 2>&1 || true
            echo '```'
            echo
            echo "### Smoke test"
            echo
            echo '```'
            cat "$RUNNER_TEMP/smoke-test.log" 2>/dev/null || echo "El smoke test no llegó a ejecutarse."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Microservicio administrador de RabbitMQ (app separada en rabbit-admin/, con su propio pom.xml).
  # Corre en paralelo a build-and-test y tampoco necesita RabbitMQ: los tests simulan el broker.
  rabbit-admin:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: rabbit-admin

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: rabbit-admin/pom.xml

      - name: Compilar y ejecutar tests (mvn verify)
        run: mvn -B verify

      # Verifica que el Dockerfile construye (no publica la imagen)
      - name: Construir imagen Docker
        run: docker build -t charmeetchic-rabbit-admin .

      - name: Subir reportes de tests
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rabbit-admin-surefire-reports
          path: rabbit-admin/target/surefire-reports/
          if-no-files-found: ignore

  # API Gateway (app separada en gateway/). Sus tests usan servidores HTTP falsos: no necesita los servicios.
  gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: gateway

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: gateway/pom.xml

      - name: Compilar y ejecutar tests (mvn verify)
        run: mvn -B verify

      - name: Construir imagen Docker
        run: docker build -t charmeetchic-gateway .

      - name: Subir reportes de tests
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gateway-surefire-reports
          path: gateway/target/surefire-reports/
          if-no-files-found: ignore
