# -----------------------------------------------------------------------------
# Ajustes SOLO para tests. Spring Boot lee classpath:/config/application.yml DESPUÉS de
# classpath:/application.yml, así que estas claves pisan a las de src/main/resources.
# No se empaqueta en el JAR (está en src/test).
#
# Objetivo: que `mvn verify` pase sin un RabbitMQ levantado (CI de GitHub incluido).
# -----------------------------------------------------------------------------
spring:
  rabbitmq:
    listener:
      simple:
        # Los @RabbitListener existen como beans, pero no se conectan al broker.
        auto-startup: false

app:
  messaging:
    # Sin publicación ni conexión de prueba al arrancar. Los tests de mensajería que lo
    # necesitan lo vuelven a encender con @TestPropertySource y un RabbitTemplate simulado.
    enabled: false
    retry:
      # Sin esperas entre reintentos para que los tests sean rápidos.
      backoff-ms: 0
