spring:
  application:
    name: charmeetchic-api
  autoconfigure:
    # No usamos usuarios en memoria: la identidad viene del JWT. Evita la
    # "generated security password" en el log.
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    # Los DTOs se construyen dentro de @Transactional; no se necesita OSIV.
    open-in-view: false
    # Hibernate crea las tablas PRIMERO y luego se ejecuta data.sql (datos iniciales).
    defer-datasource-initialization: true
  datasource:
    url: jdbc:h2:mem:testdb
    driverClassName: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
  data:
    web:
      pageable:
        max-page-size: 100
        default-page-size: 10
  lifecycle:
    # Apagado ordenado: al recibir SIGTERM, Spring espera hasta 20 s a que terminen las peticiones en
    # curso antes de cerrar el contexto. En Kubernetes debe ser MENOR que terminationGracePeriodSeconds
    # (40 s en k8s/base/api-deployment.yaml) menos el preStop (10 s): 10 + 20 = 30 s < 40 s, así el
    # kubelet nunca mata la JVM con SIGKILL a mitad del apagado.
    timeout-per-shutdown-phase: 20s
  # Conexión a RabbitMQ. Spring Boot la usa para crear la ConnectionFactory, el RabbitTemplate y el
  # RabbitAdmin. 'addresses' acepta una lista "host1:5672,host2:5672": así la misma propiedad sirve
  # para el nodo único local y para el clúster de 2 nodos (si un nodo cae, se conecta al otro).
  # Los valores por defecto son SOLO para desarrollo local (docker-compose.yml); en la nube se
  # entregan por variables de entorno y nunca se versionan.
  rabbitmq:
    addresses: ${RABBITMQ_ADDRESSES:localhost:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    listener:
      simple:
        # ACK MANUAL: el consumidor decide explícitamente basicAck / basicNack. Spring no confirma solo.
        acknowledge-mode: manual
        # Máximo de mensajes entregados y aún sin confirmar por consumidor (control de flujo).
        prefetch: 10
        # Red de seguridad: si una excepción escapara del consumidor, NO reencolar (evita loops).
        default-requeue-rejected: false
        # Arrancar los @RabbitListener junto con la app (los tests lo apagan).
        auto-startup: ${MESSAGING_ENABLED:true}
  # Conexión a KAFKA (EP5). Lista de brokers "semilla": el cliente se conecta a cualquiera de ellos y
  # descubre el resto del clúster (y quién es líder de cada partición). Por defecto, los listeners
  # EXTERNAL del docker-compose.kafka.yml en el host; en Docker se entrega kafka1:9092,kafka2:9092,kafka3:9092.
  # Productores, consumidores y manejo de errores se configuran en Java (paquete streaming.config).
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092,localhost:29092,localhost:39092}
    admin:
      # La API arranca aunque Kafka no esté (igual que con RabbitMQ): solo deja un ERROR en el log.
      fail-fast: false
      # application.yml es la fuente de verdad de los tópicos del sistema: al arrancar, KafkaAdmin crea los
      # que faltan, agrega particiones si aquí hay más y corrige las configs que alguien cambió a mano.
      modify-topic-configs: true

server:
  port: 8080
  # Deja de aceptar conexiones nuevas y termina las que están en curso antes de apagarse
  # (Tomcat). Junto con el preStop del Deployment, permite rolling updates sin errores 5xx.
  shutdown: graceful
  servlet:
    # Todas las rutas cuelgan de /api. Por eso los controladores se mapean a
    # "/products", "/orders"... y la URL final es http://localhost:8080/api/products
    context-path: /api

logging:
  level:
    com.charmeetchic: DEBUG

# ---------------------------------------------------------------------------
# Observabilidad (Evaluación 3): Actuator + Micrometer + Prometheus.
# Igual en desarrollo y en Kubernetes (perfil k8s), para que lo que se prueba en local sea lo que corre.
# Las rutas cuelgan del context-path: GET /api/actuator/health y GET /api/actuator/prometheus. Son las
# ÚNICAS rutas de Actuator sin token (SecurityConfig); cualquier otro endpoint no se expone por HTTP.
# ---------------------------------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        # Lista blanca: solo salud y métricas. env, beans, heapdump, loggers... quedan sin exponer.
        include: health,prometheus
  endpoint:
    health:
      # Sin detalles (estado de la base, disco, etc.) para un cliente anónimo: solo {"status":"UP"}.
      show-details: never
  metrics:
    # Etiqueta común a TODAS las métricas: permite filtrar por aplicación en Prometheus/Grafana aunque
    # haya otras apps en el mismo clúster (y la usan las alertas de k8s/observability).
    tags:
      application: charmeetchic-api
    distribution:
      # Histograma de buckets de la latencia HTTP: Prometheus calcula p50/p95/p99 agregando TODAS las
      # réplicas con histogram_quantile (un percentil calculado en cada pod no se puede promediar).
      # (No se usan percentiles precalculados en el cliente: con histograma activo, el registro de Prometheus
      # de Micrometer 1.13+ no los publica, y además no se pueden agregar entre réplicas.)
      percentiles-histogram:
        http.server.requests: true
        # El temporizador de peticiones EN CURSO (http.server.requests.active) hereda la clave anterior por
        # prefijo; no necesita buckets (serían ~90 series extra por réplica sin uso en el dashboard).
        http.server.requests.active: false
      # SLO de latencia: bucket explícito en 300 ms (el umbral de la alerta de p95, ver PrometheusRule).
      slo:
        http.server.requests: 300ms
  tracing:
    sampling:
      # Los identificadores de traza se generan siempre (van al log); no hay exportador, así que muestrear
      # el 100 % no envía nada fuera del pod.
      probability: 1.0

# ---------------------------------------------------------------------------
# Configuración propia de la aplicación
# ---------------------------------------------------------------------------
app:
  # Versión de la API expuesta en GET /health. Se resuelve con el filtrado de
  # recursos de Maven (delimitador @..@, habilitado por spring-boot-starter-parent
  # para application*.yml): @project.version@ se reemplaza por <version> del pom.xml
  # durante la fase process-resources, antes de compilar y de correr los tests.
  version: '@project.version@'
  cors:
    # Orígenes permitidos (separados por coma). Frontend Angular en desarrollo.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  order:
    # IVA aplicado sobre el subtotal (0.19 = 19 %).
    tax-rate: ${ORDER_TAX_RATE:0.19}
  inventory:
    # GET /products/low-stock devuelve los productos activos con stock menor a este valor.
    low-stock-threshold: ${LOW_STOCK_THRESHOLD:5}
  # -------------------------------------------------------------------------
  # Mensajería (RabbitMQ): ÚNICO lugar donde se definen los nombres de exchanges, colas y routing
  # keys, y sus políticas de retención. RabbitMQConfig (paquete messaging.config) los lee vía
  # MessagingProperties y declara los beans; ninguna otra clase escribe estos nombres "a mano".
  #
  #   Exchange                     Tipo    Routing key / patrón          Cola                       Patrón
  #   charmeetchic.inventario      direct  inventario.stock-bajo     ->  inventario.stock-bajo      asíncrono
  #   charmeetchic.inventario      direct  inventario.movimientos    ->  inventario.movimientos     asíncrono
  #   charmeetchic.inventario      direct  inventario.consulta-stock ->  inventario.consulta-stock  SÍNCRONO (RPC)
  #   charmeetchic.notificaciones  topic   notificacion.reporte.*    ->  notificaciones.reportes    asíncrono
  #   charmeetchic.ventas          fanout  (se ignora)               ->  ventas.auditoria           pub/sub
  #                                                                  ->  ventas.metricas            pub/sub
  #   charmeetchic.dlx             direct  <nombre de la DLQ>        ->  <cola>.dlq  (mensajes fallidos)
  # -------------------------------------------------------------------------
  messaging:
    # Interruptor general. false = no se publican mensajes ni se intenta conectar al arrancar
    # (RabbitStartupCheck). Lo usan los tests para correr sin RabbitMQ.
    enabled: ${MESSAGING_ENABLED:true}
    retry:
      # Intentos TOTALES de procesar un mensaje con error transitorio (1 original + 2 reintentos).
      # Al agotarlos: basicNack(requeue=false) -> DLX -> DLQ.
      max-attempts: ${RABBITMQ_RETRY_MAX_ATTEMPTS:3}
      # Espera antes de cada reintento = backoff-ms * número de intento (1 s, 2 s, ...).
      backoff-ms: ${RABBITMQ_RETRY_BACKOFF_MS:1000}
    rpc:
      # Tiempo máximo que GET /inventory/stock-check/{sku} espera la respuesta. Si no llega -> 504.
      # También es el TTL de la cola de consultas: una consulta que nadie respondió a tiempo ya no sirve.
      timeout-ms: ${RABBITMQ_RPC_TIMEOUT_MS:3000}
    demo:
      # Permite que POST /reports/inventory/async reciba "simularError" para mostrar reintentos y DLQ.
      simulated-failures-enabled: ${MESSAGING_SIMULATED_FAILURES:true}
    retention:
      # Qué hace una cola principal cuando llega a su max-length:
      #   drop-head      -> descarta el mensaje MÁS ANTIGUO. Como las colas tienen DLX, ese mensaje no se
      #                     pierde en silencio: va a la DLQ con motivo "maxlen". [ELEGIDO]
      #   reject-publish -> rechaza el mensaje NUEVO; solo se entera un productor con "publisher confirms"
      #                     (no los usamos), así que el evento se perdería sin dejar rastro.
      overflow: drop-head
      # DLQ: se guardan 7 días y como máximo 10000 mensajes, para que no crezcan sin límite.
      # (No tienen DLX: lo que vence o se descarta de una DLQ se elimina.)
      dead-letter-ttl-ms: 604800000
      dead-letter-max-length: 10000
    exchanges:
      # direct: entrega a la cola cuya binding key es IGUAL a la routing key del mensaje.
      inventario: charmeetchic.inventario
      # topic: entrega según patrones con comodines (* = una palabra, # = cero o más palabras).
      notificaciones: charmeetchic.notificaciones
      # fanout: entrega una COPIA a TODAS las colas unidas (publish/subscribe); ignora la routing key.
      ventas: charmeetchic.ventas
      # Dead Letter Exchange: recibe los mensajes rechazados (NACK sin reencolar), vencidos o descartados.
      dead-letter: charmeetchic.dlx
    queues:
      stock-bajo:
        name: inventario.stock-bajo
        routing-key: inventario.stock-bajo
        dead-letter-queue: inventario.stock-bajo.dlq
        max-length: 1000
        # Una alerta de reposición sin atender en 24 h se vence y pasa a la DLQ (queda registrada allí).
        message-ttl-ms: 86400000
      movimientos:
        name: inventario.movimientos
        routing-key: inventario.movimientos
        dead-letter-queue: inventario.movimientos.dlq
        # Auditoría: SIN TTL, un movimiento nunca debe vencer. Solo límite de tamaño.
        max-length: 10000
      reportes:
        name: notificaciones.reportes
        # En un exchange topic la binding key es un PATRÓN. El productor publica con una routing
        # key concreta que calce con él, p. ej. notificacion.reporte.inventario.
        routing-key: notificacion.reporte.*
        # Routing key concreta con que el productor publica (debe calzar con el patrón de arriba).
        # En las colas direct no hace falta: se publica con la misma routing-key.
        publish-routing-key: notificacion.reporte.inventario
        dead-letter-queue: notificaciones.reportes.dlq
        max-length: 500
      consulta-stock:
        # Cola de peticiones RPC. Sin DLQ: si la consulta vence (TTL = rpc.timeout-ms) el cliente ya
        # respondió 504 y nadie espera la respuesta; guardarla en una DLQ solo acumularía basura.
        name: inventario.consulta-stock
        routing-key: inventario.consulta-stock
        max-length: 1000
      ventas-auditoria:
        # Suscriptor 1 del fanout: registra cada venta.
        name: ventas.auditoria
        dead-letter-queue: ventas.auditoria.dlq
        max-length: 10000
      ventas-metricas:
        # Suscriptor 2 del fanout: actualiza el resumen de ventas.
        name: ventas.metricas
        dead-letter-queue: ventas.metricas.dlq
        max-length: 10000
  # -------------------------------------------------------------------------
  # Streaming (KAFKA, EP5): ÚNICO lugar con los nombres de tópicos, sus parámetros y los consumer groups.
  # StreamingProperties los valida al arrancar y KafkaTopicConfig declara los beans NewTopic.
  # Kafka COMPLEMENTA a RabbitMQ (no lo reemplaza): cada venta y cada cambio de stock sigue saliendo a
  # RabbitMQ (tareas: auditoría, alertas, reportes) Y además queda en un log de Kafka que varios grupos
  # leen de forma independiente (métricas en tiempo real, historial, monitor de stock).
  #
  #   Tópico               Key      Particiones  RF  cleanup  Retención           Grupos
  #   ventas.eventos       orderId  3            3   delete   7 días              metricas-ventas (x3), historial-ventas
  #   inventario.stock     sku      3            3   compact  último valor x sku  monitor-stock
  #   *.DLT                igual    3            3   delete   14 días             monitor-dlt
  # -------------------------------------------------------------------------
  streaming:
    # Interruptor general: false = no se publica ni se consume nada y no se crean tópicos (lo usan los tests
    # y el despliegue en Azure, que no tiene Kafka).
    enabled: ${STREAMING_ENABLED:true}
    topics:
      ventas:
        name: ventas.eventos
        # 3 particiones = hasta 3 consumidores de un mismo grupo trabajando EN PARALELO (concurrency=3 en
        # metricas-ventas, uno por partición), y con 3 brokers cada uno es líder de una: la carga de escritura
        # se reparte. La key orderId manda todos los eventos de una orden (creada -> cancelada) a la MISMA
        # partición, así se procesan en orden. Más particiones no aportarían: no hay más de 3 consumidores.
        partitions: 3
        # RF 3: cada partición vive en los 3 brokers; tolera perder 1 broker sin perder datos ni dejar de
        # escribir (min.insync.replicas=2).
        replicas: 3
        configs:
          # delete: los eventos de venta son HECHOS que ocurrieron una vez; se guardan TODOS (no se resumen por
          # key) y se borran por antigüedad.
          "[cleanup.policy]": delete
          # 7 días: margen para reprocesar una semana (reconstruir métricas, sumar un consumidor nuevo que lea
          # el historial, recuperarse de un consumidor caído el fin de semana) sin guardar datos para siempre.
          "[retention.ms]": "604800000"
          # Con acks=all la escritura se confirma cuando 2 de las 3 réplicas la tienen.
          "[min.insync.replicas]": "2"
      stock:
        name: inventario.stock
        # Mismas razones de paralelismo y reparto de líderes; la key sku mantiene en orden los cambios de un
        # mismo producto (dentro de una partición el orden está garantizado, entre particiones no).
        partitions: 3
        replicas: 3
        configs:
          # compact: solo importa el ÚLTIMO stock de cada producto. Kafka conserva al menos el último mensaje
          # de cada key (sku) y descarta los anteriores; el tópico funciona como "tabla de stock actual" que
          # un consumidor nuevo puede leer desde el inicio para reconstruir el estado (monitor-stock lo hace).
          "[cleanup.policy]": compact
          # Un cambio queda visible al menos 1 minuto antes de poder compactarse: los consumidores en vivo
          # alcanzan a ver cada cambio (no solo el último) aunque se atrasen un poco.
          "[min.compaction.lag.ms]": "60000"
          # La compactación solo actúa sobre segmentos CERRADOS. Con el valor por defecto (7 días) nunca se
          # vería compactar; 10 minutos cierra segmentos a menudo sin crear miles de archivos.
          "[segment.ms]": "600000"
          # Compactar cuando el 10 % del log sea "sucio" (valores ya reemplazados); por defecto 50 %.
          "[min.cleanable.dirty.ratio]": "0.1"
          # Un tombstone (valor null = producto eliminado) se conserva 1 día para que todos lo vean.
          "[delete.retention.ms]": "86400000"
          "[min.insync.replicas]": "2"
      dead-letter:
        # Sufijo de los tópicos de error: ventas.eventos.DLT e inventario.stock.DLT.
        suffix: .DLT
        # Deben tener AL MENOS las mismas particiones que el original: el recuperador publica el mensaje
        # fallido en la MISMA partición de la que vino (así no se mezcla el orden de las keys).
        partitions: 3
        replicas: 3
        configs:
          # Se guardan todos los fallidos (nunca se compacta: dos errores del mismo sku son dos casos distintos).
          "[cleanup.policy]": delete
          # 14 días: el doble que el tópico original, para investigar y reprocesar con calma.
          "[retention.ms]": "1209600000"
          "[min.insync.replicas]": "2"
    consumers:
      # Cada grupo recibe TODOS los mensajes del tópico; dentro de un grupo las particiones se reparten.
      metricas-ventas:
        group: metricas-ventas
        concurrency: 3            # 3 consumidores = 1 por partición
      historial-ventas:
        group: historial-ventas
        concurrency: 1            # 1 consumidor con las 3 particiones (contraste con metricas-ventas)
      monitor-stock:
        group: monitor-stock
        concurrency: 1
      monitor-dlt:
        group: monitor-dlt
        concurrency: 1
    retry:
      # Reintentos ante un error TRANSITORIO (1 intento + 2 reintentos) con espera fija entre ellos. Un payload
      # inválido (JSON roto o que no pasa la validación) NO se reintenta: va directo al .DLT.
      attempts: 2
      backoff-ms: ${KAFKA_RETRY_BACKOFF_MS:1000}
    metrics:
      # Ventana de "ventas del último minuto", tamaño del ranking y de la lista de últimos eventos.
      window-seconds: 60
      top-size: 5
      recent-events: 20
    demo:
      # POST /api/streaming/simulate?tipoDefecto=TRANSITORIO hace fallar el consumo para mostrar reintentos.
      simulated-failures-enabled: ${STREAMING_SIMULATED_FAILURES:true}
      # Máximo de ventas sintéticas por llamada (que nadie llene el disco con un solo clic).
      max-simulated-sales: 1000
  jwt:
    # firebase -> valida ID tokens de Firebase Authentication (RS256, claves públicas de Google vía JWKS)
    #             [DEFAULT / producción]
    # local    -> valida tokens HS256 firmados con local-secret (SOLO desarrollo y tests)
    mode: ${JWT_MODE:firebase}
    local-secret: ${JWT_LOCAL_SECRET:}
    clock-skew-seconds: 60
    jwks-min-refresh-seconds: 300

# ---------------------------------------------------------------------------
# Firebase Authentication (reemplaza a Azure AD)
# ---------------------------------------------------------------------------
firebase:
  # Project ID de tu proyecto de Firebase (Firebase Console -> Project settings -> General).
  # Es la ÚNICA configuración necesaria: de él salen el issuer (https://securetoken.google.com/<id>)
  # y la audience (<id>) que se exigen en los tokens. Se puede sobrescribir con FIREBASE_PROJECT_ID.
  # No hace falta ninguna credencial: los tokens se verifican con las claves PÚBLICAS de Google.
  project-id: ${FIREBASE_PROJECT_ID:charme-et-chic}
