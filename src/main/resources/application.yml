spring:
  application:
    name: charmeetchic-api
  autoconfigure:
    # No usamos usuarios en memoria: la identidad viene del JWT. Evita la
    # "generated security password" en el log.
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    # Los DTOs se construyen dentro de @Transactional; no se necesita OSIV.
    open-in-view: false
    # Hibernate crea las tablas PRIMERO y luego se ejecuta data.sql (datos iniciales).
    defer-datasource-initialization: true
  datasource:
    url: jdbc:h2:mem:testdb
    driverClassName: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
  data:
    web:
      pageable:
        max-page-size: 100
        default-page-size: 10
  # Conexión a RabbitMQ. Spring Boot la usa para crear la ConnectionFactory, el RabbitTemplate y el
  # RabbitAdmin. 'addresses' acepta una lista "host1:5672,host2:5672": así la misma propiedad sirve
  # para el nodo único local y para el clúster de 2 nodos (si un nodo cae, se conecta al otro).
  # Los valores por defecto son SOLO para desarrollo local (docker-compose.yml); en la nube se
  # entregan por variables de entorno y nunca se versionan.
  rabbitmq:
    addresses: ${RABBITMQ_ADDRESSES:localhost:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    listener:
      simple:
        # ACK MANUAL: el consumidor decide explícitamente basicAck / basicNack. Spring no confirma solo.
        acknowledge-mode: manual
        # Máximo de mensajes entregados y aún sin confirmar por consumidor (control de flujo).
        prefetch: 10
        # Red de seguridad: si una excepción escapara del consumidor, NO reencolar (evita loops).
        default-requeue-rejected: false
        # Arrancar los @RabbitListener junto con la app (los tests lo apagan).
        auto-startup: ${MESSAGING_ENABLED:true}

server:
  port: 8080
  servlet:
    # Todas las rutas cuelgan de /api. Por eso los controladores se mapean a
    # "/products", "/orders"... y la URL final es http://localhost:8080/api/products
    context-path: /api

logging:
  level:
    com.charmeetchic: DEBUG

# ---------------------------------------------------------------------------
# Configuración propia de la aplicación
# ---------------------------------------------------------------------------
app:
  # Versión de la API expuesta en GET /health. Se resuelve con el filtrado de
  # recursos de Maven (delimitador @..@, habilitado por spring-boot-starter-parent
  # para application*.yml): @project.version@ se reemplaza por <version> del pom.xml
  # durante la fase process-resources, antes de compilar y de correr los tests.
  version: '@project.version@'
  cors:
    # Orígenes permitidos (separados por coma). Frontend Angular en desarrollo.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  order:
    # IVA aplicado sobre el subtotal (0.19 = 19 %).
    tax-rate: ${ORDER_TAX_RATE:0.19}
  inventory:
    # GET /products/low-stock devuelve los productos activos con stock menor a este valor.
    low-stock-threshold: ${LOW_STOCK_THRESHOLD:5}
  # -------------------------------------------------------------------------
  # Mensajería (RabbitMQ): ÚNICO lugar donde se definen los nombres de exchanges, colas y routing
  # keys. RabbitMQConfig (paquete messaging.config) los lee vía MessagingProperties y declara los
  # beans; ninguna otra clase escribe estos nombres "a mano".
  #
  #   Exchange                      Tipo    Routing key / patrón        Cola
  #   charmeetchic.inventario       direct  inventario.stock-bajo   ->  inventario.stock-bajo
  #   charmeetchic.inventario       direct  inventario.movimientos  ->  inventario.movimientos
  #   charmeetchic.notificaciones   topic   notificacion.reporte.*  ->  notificaciones.reportes
  #   charmeetchic.dlx              direct  <nombre de la DLQ>      ->  <cola>.dlq  (mensajes fallidos)
  # -------------------------------------------------------------------------
  messaging:
    # Interruptor general. false = no se publican mensajes ni se intenta conectar al arrancar
    # (RabbitStartupCheck). Lo usan los tests para correr sin RabbitMQ.
    enabled: ${MESSAGING_ENABLED:true}
    retry:
      # Intentos TOTALES de procesar un mensaje con error transitorio (1 original + 2 reintentos).
      # Al agotarlos: basicNack(requeue=false) -> DLX -> DLQ.
      max-attempts: ${RABBITMQ_RETRY_MAX_ATTEMPTS:3}
      # Espera antes de cada reintento = backoff-ms * número de intento (1 s, 2 s, ...).
      backoff-ms: ${RABBITMQ_RETRY_BACKOFF_MS:1000}
    demo:
      # Permite que POST /reports/inventory/async reciba "simularError" para mostrar reintentos y DLQ.
      simulated-failures-enabled: ${MESSAGING_SIMULATED_FAILURES:true}
    exchanges:
      # direct: entrega a la cola cuya binding key es IGUAL a la routing key del mensaje.
      inventario: charmeetchic.inventario
      # topic: entrega según patrones con comodines (* = una palabra, # = cero o más palabras).
      notificaciones: charmeetchic.notificaciones
      # Dead Letter Exchange: recibe los mensajes rechazados (NACK sin reencolar) de las 3 colas.
      dead-letter: charmeetchic.dlx
    queues:
      stock-bajo:
        name: inventario.stock-bajo
        routing-key: inventario.stock-bajo
        dead-letter-queue: inventario.stock-bajo.dlq
      movimientos:
        name: inventario.movimientos
        routing-key: inventario.movimientos
        dead-letter-queue: inventario.movimientos.dlq
      reportes:
        name: notificaciones.reportes
        # En un exchange topic la binding key es un PATRÓN. El productor publica con una routing
        # key concreta que calce con él, p. ej. notificacion.reporte.inventario.
        routing-key: notificacion.reporte.*
        # Routing key concreta con que el productor publica (debe calzar con el patrón de arriba).
        # En las colas direct no hace falta: se publica con la misma routing-key.
        publish-routing-key: notificacion.reporte.inventario
        dead-letter-queue: notificaciones.reportes.dlq
  jwt:
    # firebase -> valida ID tokens de Firebase Authentication (RS256, claves públicas de Google vía JWKS)
    #             [DEFAULT / producción]
    # local    -> valida tokens HS256 firmados con local-secret (SOLO desarrollo y tests)
    mode: ${JWT_MODE:firebase}
    local-secret: ${JWT_LOCAL_SECRET:}
    clock-skew-seconds: 60
    jwks-min-refresh-seconds: 300

# ---------------------------------------------------------------------------
# Firebase Authentication (reemplaza a Azure AD)
# ---------------------------------------------------------------------------
firebase:
  # Project ID de tu proyecto de Firebase (Firebase Console -> Project settings -> General).
  # Es la ÚNICA configuración necesaria: de él salen el issuer (https://securetoken.google.com/<id>)
  # y la audience (<id>) que se exigen en los tokens. Se puede sobrescribir con FIREBASE_PROJECT_ID.
  # No hace falta ninguna credencial: los tokens se verifican con las claves PÚBLICAS de Google.
  project-id: ${FIREBASE_PROJECT_ID:charme-et-chic}
